name: 贵州国企招聘监控

on:
  schedule:
    - cron: '0 1 * * *'   # 北京时间 09:00 (UTC 01:00)
  workflow_dispatch:       # 手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行监控脚本
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
        run: |
          python job_monitor_github.py
